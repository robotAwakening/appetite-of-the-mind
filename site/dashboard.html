<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaign Dashboard</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
  <style>
    main { max-width: 1000px; padding-top: 32px; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
    th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 500; }
    .table-wrap { overflow-x: auto; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .tiles div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .tiles b { display: block; font-size: 28px; }
    .tiles small { color: var(--muted); }
    .bars div { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 4px 0; }
    .bars span:first-child { width: 90px; flex: none; color: var(--muted); }
    .bars i { height: 14px; background: var(--accent); border-radius: 3px; min-width: 2px; }
  </style>
</head>
<body>
<main>
  <h1>Campaign dashboard</h1>
  <p class="muted">Refreshes every 30 seconds. <a id="csv" style="color:var(--accent)">Download subscribers (CSV)</a></p>
  <section class="tiles" id="tiles"></section>
  <section class="card">
    <h2>By channel</h2>
    <div class="table-wrap"><table id="channels"></table></div>
  </section>
  <section class="card"><h2>Supporters per day</h2><div class="bars" id="daily"></div></section>
  <section class="card"><h2>Top countries</h2><div class="bars" id="countries"></div></section>
</main>
<script>
  const key = new URLSearchParams(location.search).get("key");
  document.getElementById("csv").href = "/api/subscribers.csv?key=" + encodeURIComponent(key);
  const pct = (a, b) => (b ? (100 * a / b).toFixed(1) + "%" : "–");
  let cur = "eur";
  const money = (c) => new Intl.NumberFormat(undefined, { style: "currency", currency: cur.toUpperCase() }).format(c / 100);

  function bars(el, rows, label, value) {
    const max = Math.max(1, ...rows.map(value));
    el.replaceChildren(...rows.map((r) => {
      const d = document.createElement("div");
      d.innerHTML = "<span></span><i></i><span></span>";
      d.children[0].textContent = label(r);
      d.children[1].style.width = (60 * value(r) / max) + "%";
      d.children[2].textContent = value(r);
      return d;
    }));
  }

  async function load() {
    const m = await (await fetch("/api/metrics?key=" + encodeURIComponent(key))).json();
    cur = m.currency;
    const t = m.totals;
    const tiles = [
      ["Visits", t.visits], ["Checkouts started", t.checkouts], ["Supporters", t.supporters],
      ["Raised", money(t.total_cents)], ["Visit → paid", pct(t.supporters, t.visits)],
      ["Checkout → paid", pct(t.supporters, t.checkouts)], ["Avg. gift", t.supporters ? money(t.total_cents / t.supporters) : "–"],
      ["Subscribers", t.subscribers],
    ];
    document.getElementById("tiles").innerHTML = tiles.map(([k, v]) => `<div><b>${v}</b><small>${k}</small></div>`).join("");

    const tbl = document.getElementById("channels");
    tbl.innerHTML = "<tr><th>Channel</th><th>Visits</th><th>Checkouts</th><th>Paid</th><th>Raised</th><th>Conversion</th></tr>";
    for (const r of m.by_channel) {
      const tr = tbl.insertRow();
      [r.channel, r.visits, r.checkouts, r.supporters, money(r.total_cents), pct(r.supporters, r.visits)]
        .forEach((v) => (tr.insertCell().textContent = v));
    }
    bars(document.getElementById("daily"), m.daily, (r) => r.day, (r) => r.supporters);
    bars(document.getElementById("countries"), m.countries, (r) => r.country, (r) => r.n);
  }
  load(); setInterval(load, 30000);
</script>
</body>
</html>
